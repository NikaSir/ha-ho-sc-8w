    icon: mdi:calendar-clock
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Расписание
            icon: mdi:calendar-clock
          - type: markdown
            content: >-
              Расписание читается из **DP38 `normal_time`** и на этом этапе является **только для просмотра**. Панель не формирует raw Tuya-команды.
            grid_options: {columns: 12}
      - type: grid
        cards:
          - type: heading
            heading: Зона 1
            icon: mdi:numeric-1-circle-outline
          - type: markdown
            content: >-
              {% set e='sensor.kontroller_poliva_ho_sc_8w_schedule_zone_1' %}
              **{{ 'Включена' if states(e) == 'configured' else ('Выключена' if states(e) == 'disabled' else '⚠️ Нет достоверных данных') }}**  
              Старт: **{{ (state_attr(e,'start_times') or []) | join(', ') or '—' }}**  
              Базовая длительность: **{{ state_attr(e,'duration_min') if state_attr(e,'duration_min') is not none else '—' }} мин**  
              {% set m=state_attr(e,'calendar_mode') %}{% if m == 'interval' %}Цикл: **каждые {{ state_attr(e,'interval_days') }} дн.**, от {{ state_attr(e,'interval_start') }}{% elif m == 'odd' %}Цикл: **нечётные дни**{% elif m == 'even' %}Цикл: **чётные дни**{% elif m == 'weekly' %}Цикл: **по выбранным дням**{% else %}Цикл: **{{ m or '—' }}**{% endif %}  
              Дождь по зоне: **{{ 'учитывается*' if state_attr(e,'rain_sensor_follow') else 'игнорируется*' }}**  
              \* флаг декодирован и подтверждён наблюдением, но write-верификация ещё не завершена.
