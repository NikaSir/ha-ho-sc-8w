  - title: Диагностика
    path: diagnostics
    icon: mdi:stethoscope
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Соединение
            icon: mdi:lan-connect
          - type: markdown
            content: >-
              {% set e='sensor.kontroller_poliva_ho_sc_8w_connection_mode' %}
              **Активный транспорт:** {{ states(e) }}  
              **Предпочтение:** {{ state_attr(e,'selected_preference') or '—' }}  
              **Cloud доступен:** {{ state_attr(e,'cloud_available') }}  
