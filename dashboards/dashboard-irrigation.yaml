title: Полив
views:
  - title: Обзор
    path: overview
    icon: mdi:sprinkler-variant
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Полив сейчас
            icon: mdi:sprinkler
          - type: markdown
            content: >-
              {% set conn = states('sensor.kontroller_poliva_ho_sc_8w_connection_mode') %}
              {% set op = states('sensor.kontroller_poliva_ho_sc_8w_operation_mode') %}
              {% set active = states('sensor.kontroller_poliva_ho_sc_8w_active_zones') %}
              {% set queued = states('sensor.kontroller_poliva_ho_sc_8w_queued_zones') %}
              {% if conn in ['unknown', 'unavailable'] %}
              ## ⚠️ Контроллер недоступен
              Данные о поливе сейчас недостоверны.
              {% elif active in ['unknown', 'unavailable'] %}
              ## ⚠️ Состояние полива неизвестно
              Связь: **{{ conn }}** · Режим: **{{ op }}**
              {% elif active == 'None' %}
              ## Полив не идёт
              Контроллер доступен · **{{ conn }}** · **{{ op }}**
              {% else %}
              {% set z = active.split(',')[0] | trim %}
              ## 💧 Полив идёт · зона {{ z }}
              **Осталось:** {{ states('sensor.kontroller_poliva_ho_sc_8w_zone_' ~ z ~ '_time_remaining') }} мин  
              **Прошло:** {{ states('sensor.kontroller_poliva_ho_sc_8w_zone_' ~ z ~ '_time_elapsed') }} мин  
              {% if queued not in ['None', 'unknown', 'unavailable'] %}**Далее:** {{ queued }}{% endif %}
              {% endif %}
            entity_id:
              - sensor.kontroller_poliva_ho_sc_8w_connection_mode
              - sensor.kontroller_poliva_ho_sc_8w_operation_mode
              - sensor.kontroller_poliva_ho_sc_8w_active_zones
              - sensor.kontroller_poliva_ho_sc_8w_queued_zones
              - sensor.kontroller_poliva_ho_sc_8w_zone_1_time_remaining
              - sensor.kontroller_poliva_ho_sc_8w_zone_1_time_elapsed
              - sensor.kontroller_poliva_ho_sc_8w_zone_2_time_remaining
              - sensor.kontroller_poliva_ho_sc_8w_zone_2_time_elapsed
              - sensor.kontroller_poliva_ho_sc_8w_zone_3_time_remaining
              - sensor.kontroller_poliva_ho_sc_8w_zone_3_time_elapsed
              - sensor.kontroller_poliva_ho_sc_8w_zone_4_time_remaining
              - sensor.kontroller_poliva_ho_sc_8w_zone_4_time_elapsed
              - sensor.kontroller_poliva_ho_sc_8w_zone_5_time_remaining
              - sensor.kontroller_poliva_ho_sc_8w_zone_5_time_elapsed
              - sensor.kontroller_poliva_ho_sc_8w_zone_6_time_remaining
              - sensor.kontroller_poliva_ho_sc_8w_zone_6_time_elapsed
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.kontroller_poliva_ho_sc_8w_connection_mode
            name: Связь
            icon: mdi:lan-connect
            tap_action:
              action: more-info
            hold_action:
              action: more-info
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.kontroller_poliva_ho_sc_8w_operation_mode
            name: Режим
            icon: mdi:water-pump
            tap_action:
              action: more-info
            hold_action:
              action: more-info
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.09_kotelnaia_kontroller_poliva_ho_sc_8w_rain_sensor
            name: Датчик дождя
            icon: mdi:weather-rainy
            tap_action:
              action: more-info
            hold_action:
              action: more-info
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.09_kotelnaia_kontroller_poliva_ho_sc_8w_seasonal_adjustment
            name: Сезонная коррекция
            icon: mdi:percent-outline
            tap_action:
              action: more-info
            hold_action:
              action: more-info
            grid_options:
              columns: 6
          - type: markdown
            content: >-
              **Главный клапан:** —  
              Интеграция пока не предоставляет подтверждённую сущность состояния главного клапана. Панель намеренно не подменяет её косвенными признаками.
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: Очередь и состояние
            icon: mdi:playlist-play
          - type: tile
            entity: sensor.kontroller_poliva_ho_sc_8w_active_zones
            name: Активная зона
            icon: mdi:sprinkler-variant
            tap_action:
              action: more-info
            hold_action:
              action: more-info
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.kontroller_poliva_ho_sc_8w_queued_zones
            name: Очередь
            icon: mdi:playlist-play
            tap_action:
              action: more-info
            hold_action:
              action: more-info
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.09_kotelnaia_kontroller_poliva_ho_sc_8w_timer_error_alarm
            name: Ошибка таймера
            icon: mdi:alarm-light-outline
            tap_action:
              action: more-info
            hold_action:
              action: more-info
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: Зоны 1–6
            icon: mdi:view-grid-outline
          - type: markdown
            content: >-
              {% set active = states('sensor.kontroller_poliva_ho_sc_8w_active_zones') %}
              {% set queued = states('sensor.kontroller_poliva_ho_sc_8w_queued_zones') %}
              {% for z in range(1, 7) %}
              {% set zs = z|string %}
              {% set rem = states('sensor.kontroller_poliva_ho_sc_8w_zone_' ~ zs ~ '_time_remaining') %}
              {% set is_active = zs in active.split(', ') if active not in ['None','unknown','unavailable'] else false %}
              {% set is_queued = zs in queued.split(', ') if queued not in ['None','unknown','unavailable'] else false %}
              **{{ '💧' if is_active else ('⏭️' if is_queued else '○') }} Зона {{ z }}**{% if is_active %} · осталось {{ rem }} мин{% elif is_queued %} · в очереди{% else %} · готова{% endif %}  
              {% endfor %}
            entity_id:
              - sensor.kontroller_poliva_ho_sc_8w_active_zones
              - sensor.kontroller_poliva_ho_sc_8w_queued_zones
              - sensor.kontroller_poliva_ho_sc_8w_zone_1_time_remaining
              - sensor.kontroller_poliva_ho_sc_8w_zone_1_time_elapsed
              - sensor.kontroller_poliva_ho_sc_8w_zone_2_time_remaining
              - sensor.kontroller_poliva_ho_sc_8w_zone_2_time_elapsed
              - sensor.kontroller_poliva_ho_sc_8w_zone_3_time_remaining
              - sensor.kontroller_poliva_ho_sc_8w_zone_3_time_elapsed
              - sensor.kontroller_poliva_ho_sc_8w_zone_4_time_remaining
              - sensor.kontroller_poliva_ho_sc_8w_zone_4_time_elapsed
              - sensor.kontroller_poliva_ho_sc_8w_zone_5_time_remaining
              - sensor.kontroller_poliva_ho_sc_8w_zone_5_time_elapsed
              - sensor.kontroller_poliva_ho_sc_8w_zone_6_time_remaining
              - sensor.kontroller_poliva_ho_sc_8w_zone_6_time_elapsed
            grid_options:
              columns: 12
          - type: button
            name: Все зоны
            icon: mdi:sprinkler-variant
            tap_action:
              action: navigate
              navigation_path: /dashboard-irrigation/zones
            grid_options:
              columns: 6
          - type: button
            name: Программы
            icon: mdi:calendar-clock
            tap_action:
              action: navigate
              navigation_path: /dashboard-irrigation/programs
            grid_options:
              columns: 6
          - type: button
            name: Диагностика
            icon: mdi:stethoscope
            tap_action:
              action: navigate
              navigation_path: /dashboard-irrigation/diagnostics
            grid_options:
              columns: 12

