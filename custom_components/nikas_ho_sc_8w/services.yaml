start_manual_queue:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w
    zones:
      required: true
      example:
        - zone: 1
          duration_minutes: 5
        - zone: 4
          duration_minutes: 12
      selector:
        object:

stop_manual:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w

skip_current_manual:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w

resume_automatic:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w

set_seasonal_adjustment:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w
    value:
      required: true
      example: 20
      selector:
        number:
          min: -90
          max: 100
          step: 10
          mode: box

set_zone8_schedule_field:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w
    field:
      required: true
      example: duration_minutes
      selector:
        select:
          options:
            - duration_minutes
            - start_time_1
            - start_time_2
            - start_time_3
            - start_time_4
            - start_time_5
            - start_time_6
            - cycle_mode
            - cycle_value
            - anchor_date
            - rain_sensor_follow
    value:
      required: true
      example: "1"
      selector:
        text:

restore_zone8_schedule:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w
