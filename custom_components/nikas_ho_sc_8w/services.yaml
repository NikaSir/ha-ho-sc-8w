start_manual_queue:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w
    zones:
      required: true
      example:
        - zone: 1
          duration_minutes: 5
        - zone: 4
          duration_minutes: 12
      selector:
        object:

stop_manual:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w

skip_current_manual:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w

resume_automatic:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w

set_seasonal_adjustment:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w
    value:
      required: true
      example: 20
      selector:
        number:
          min: -90
          max: 100
          step: 10
          mode: box

probe_zone8_dp38_hex:
  name: Read Zone 8 DP38
  description: Reads the current Zone 8 DP38 block twice without sending any write command.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w
    confirmation:
      required: true
      example: ZONE8_DP38_HEX_PROBE
      selector:
        select:
          options:
            - ZONE8_DP38_HEX_PROBE

capture_dp38_snapshot:
  name: Capture full DP38 snapshot
  description: Captures all eight DP38 schedule blocks or compares them with the saved baseline while the powered controller is in Auto and idle. No write command is sent.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w
    phase:
      required: true
      selector:
        select:
          options:
            - baseline
            - compare
    confirmation:
      required: true
      example: DP38_FULL_SNAPSHOT_READ_ONLY
      selector:
        select:
          options:
            - DP38_FULL_SNAPSHOT_READ_ONLY

test_zone8_mask_write:
  name: Test Zone 8 with its DP38 write mask
  description: Sends exactly one 20-byte DP38 block as 40 uppercase ASCII-HEX characters. Byte 0 is the Zone 8 write mask 0x80; only anchor day 04 to 05 differs. No retry or rollback is sent.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w
    confirmation:
      required: true
      example: WRITE_DP38_ZONE8_MASK_80_DATE_2026_09_05_ONCE
      selector:
        select:
          options:
            - WRITE_DP38_ZONE8_MASK_80_DATE_2026_09_05_ONCE

prepare_zone7_lab:
  name: Prepare Zone 7 DP38 lab transaction
  description: Read-only prepare step. Captures all eight DP38 blocks, builds a minimal Zone 7 patch and returns plan_id, confirmation token and byte diff. Sends no write. start_time_1 is currently restricted to the guarded 06:30 empty-bank probe.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w
    field:
      required: true
      selector:
        select:
          options:
            - duration_minutes
            - start_time_1
            - cycle_mode
            - cycle_value
            - weekdays
            - anchor_date
            - program_enabled
            - rain_sensor_follow
    value:
      required: true
      selector:
        text:

execute_zone7_lab:
  name: Execute prepared Zone 7 DP38 lab transaction
  description: Single-use guarded write. Re-reads all eight zones, refuses stale plans, writes Zone 7 once, then verifies Zone 7 and confirms that zones 1-6 and 8 stayed byte-for-byte unchanged. No retry and no automatic rollback.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w
    plan_id:
      required: true
      selector:
        text:
    confirmation:
      required: true
      selector:
        text:

prepare_zone7_duration17:
  name: Prepare Zone 7 duration=17 probe
  description: Read-only preflight. Captures all eight DP38 blocks and prepares a one-byte duration change for Zone 7. No write is sent.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w

execute_zone7_duration17:
  name: Execute Zone 7 duration=17 probe
  description: Executes exactly the previously prepared Zone 7 duration=17 DP38 transaction once, then re-reads and compares all eight zones. No retry or automatic rollback.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w
    confirmation:
      required: true
      example: WRITE_ZONE7_DURATION_17_ONCE
      selector:
        select:
          options:
            - WRITE_ZONE7_DURATION_17_ONCE
