start_manual_queue:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w
    zones:
      required: true
      example:
        - zone: 1
          duration_minutes: 5
        - zone: 4
          duration_minutes: 12
      selector:
        object:

stop_manual:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w

skip_current_manual:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w

resume_automatic:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w

set_seasonal_adjustment:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w
    value:
      required: true
      example: 20
      selector:
        number:
          min: -90
          max: 100
          step: 10
          mode: box

probe_zone8_dp38_hex:
  name: Read Zone 8 DP38
  description: Reads the current Zone 8 DP38 block twice without sending any write command.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w
    confirmation:
      required: true
      example: ZONE8_DP38_HEX_PROBE
      selector:
        select:
          options:
            - ZONE8_DP38_HEX_PROBE

test_zone8_anchor_date_write:
  name: Test Zone 8 anchor-date write
  description: Writes Zone 8 once, changing only its anchor date from 2026-09-03 to 2026-09-02, then verifies repeated DP38 read-back.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: nikas_ho_sc_8w
    confirmation:
      required: true
      example: WRITE_ZONE8_ANCHOR_DATE_2026_09_02_ONCE
      selector:
        select:
          options:
            - WRITE_ZONE8_ANCHOR_DATE_2026_09_02_ONCE
