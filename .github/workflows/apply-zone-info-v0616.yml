name: Apply HO-SC-8W zone info v0.6.16

on:
  push:
    branches:
      - sol/ho-sc-8w-zone-info-v0616

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/ho-sc-8w-zone-info-v0616
          fetch-depth: 0

      - name: Apply composition patch
        run: python scripts/apply_zone_info_v0616.py

      - name: Validate patched panel
        run: |
          node --check custom_components/nikas_ho_sc_8w/frontend/irrigation-panel.js
          node scripts/check-panel-ui-v16.mjs
          python -m compileall -q custom_components/nikas_ho_sc_8w
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('panel.json'), Path('panel_manifest.json'), Path('custom_components/nikas_ho_sc_8w/manifest.json')]:
              json.loads(path.read_text(encoding='utf-8'))
              print('OK', path)
          PY

      - name: Commit result
        run: |
          git config user.name "NikaS UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-zone-info-v0616.yml scripts/apply_zone_info_v0616.py
          git add custom_components/nikas_ho_sc_8w/frontend/irrigation-panel.js \
                  custom_components/nikas_ho_sc_8w/const.py \
                  custom_components/nikas_ho_sc_8w/manifest.json \
                  custom_components/nikas_ho_sc_8w/frontend.py \
                  panel.json panel_manifest.json \
                  scripts/check-panel-ui-v16.mjs \
                  docs/NIKAS_SPECIALIZED_PANEL_COMPLIANCE.md
          git commit -m "Recompose HO-SC-8W zone information and status fit"
          git push origin HEAD:sol/ho-sc-8w-zone-info-v0616
