name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('.').rglob('*.json'):
              if '.git' in path.parts:
                  continue
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'OK {path}')
          PY

      - name: Compile Python sources when present
        run: |
          if [ -d custom_components ]; then
            python -m compileall -q custom_components
          fi

      - name: Enforce NikaS UI standard v1.7
        run: python scripts/check_nikas_ui_standard.py

      - name: Validate production panel bundle and local assets
        shell: bash
        run: |
          bundle="custom_components/nikas_ho_sc_8w/frontend/irrigation-panel.js"
          test -f "$bundle"
          node --check "$bundle"
          node scripts/check-panel-ui-v16.mjs
          test -f custom_components/nikas_ho_sc_8w/brand/icon.png

          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('panel_manifest.json', 'utf8'));
          for (const asset of manifest.assets) {
            if (!fs.existsSync(asset.path)) {
              throw new Error(`Missing panel asset: ${asset.path}`);
            }
          }
          NODE

          if grep -Eq 'data:image/|;base64,' "$bundle"; then
            echo 'Inline Base64 image detected in production bundle.'
            exit 1
          fi

          if grep -Eq 'https?://[^"[:space:]]+\.(png|jpe?g|webp|gif|svg)' "$bundle"; then
            echo 'External image URL detected in production bundle.'
            exit 1
          fi

          count="$(find custom_components/nikas_ho_sc_8w/frontend -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "Expected exactly one production JavaScript bundle, found $count"
            find custom_components/nikas_ho_sc_8w/frontend -maxdepth 1 -type f -name '*.js' -print
            exit 1
          fi

          if grep -Eq '(^|[[:space:]])import[[:space:]].*irrigation-panel-v[0-9]+' "$bundle"; then
            echo 'Historical frontend runtime import detected in production bundle.'
            exit 1
          fi

          if grep -Eq 'irrigation-panel-v0(3|4)[0-9]*\.js' "$bundle"; then
            echo 'Historical frontend filename reference detected in production bundle.'
            exit 1
          fi

          if ! grep -Fq 'hass-toggle-menu' "$bundle"; then
            echo 'Native Home Assistant sidebar menu event is missing from production panel.'
            exit 1
          fi

          if grep -Eq 'style\.zoom|(^|[;{[:space:]])zoom[[:space:]]*:' "$bundle"; then
            echo 'Legacy CSS zoom detected; specialized panels must use one transform canvas.'
            exit 1
          fi

          for marker in 'class="workViewport' 'class="workCanvas"' 'translate3d' 'touch-action:none' 'touch-action:pan-y' 'scrollTop' 'scale > 1' 'Масштаб 100%'; do
            if ! grep -Fq "$marker" "$bundle"; then
              echo "Required transform-canvas marker is missing: $marker"
              exit 1
            fi
          done

          if [ "$(grep -Fo 'class="workViewport ' "$bundle" | wc -l | tr -d ' ')" != "1" ] || \
             [ "$(grep -Fo 'class="workCanvas"' "$bundle" | wc -l | tr -d ' ')" != "1" ]; then
            echo 'The panel must declare exactly one work viewport and one work canvas template.'
            exit 1
          fi

          grep -Fq '"native_vertical_scroll_at_100": true' panel.json
          grep -Fq '"one_pointer_pan_above_100_only": true' panel.json
          grep -Fq '"tab_change_returns_to_top": true' panel.json

          echo 'OK production frontend bundle and integration-owned assets'

      - name: Reject tracked credential/key files
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(secrets\.yaml|\.env($|\.)|.*\.(pem|key|p12)$)' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$forbidden" ]; then
            echo 'Forbidden credential/key-like files are tracked:'
            echo "$forbidden"
            exit 1
          fi

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
          comment: false

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master
