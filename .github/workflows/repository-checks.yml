name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('.').rglob('*.json'):
              if '.git' in path.parts:
                  continue
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'OK {path}')
          PY

      - name: Compile Python sources when present
        run: |
          if [ -d custom_components ]; then
            python -m compileall -q custom_components
          fi

      - name: Validate self-contained production panel bundle
        shell: bash
        run: |
          bundle="custom_components/nikas_ho_sc_8w/frontend/irrigation-panel.js"
          test -f "$bundle"
          node --check "$bundle"

          count="$(find custom_components/nikas_ho_sc_8w/frontend -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "Expected exactly one production JavaScript bundle, found $count"
            find custom_components/nikas_ho_sc_8w/frontend -maxdepth 1 -type f -name '*.js' -print
            exit 1
          fi

          if grep -Eq '(^|[[:space:]])import[[:space:]].*irrigation-panel-v[0-9]+' "$bundle"; then
            echo 'Historical frontend runtime import detected in production bundle.'
            exit 1
          fi

          if grep -Eq 'irrigation-panel-v0(3|4)[0-9]*\.js' "$bundle"; then
            echo 'Historical frontend filename reference detected in production bundle.'
            exit 1
          fi

          if ! grep -Fq 'hass-toggle-menu' "$bundle"; then
            echo 'Native Home Assistant sidebar menu event is missing from production panel.'
            exit 1
          fi

          echo 'OK self-contained frontend bundle'

      - name: Reject tracked credential/key files
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(secrets\.yaml|\.env($|\.)|.*\.(pem|key|p12)$)' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$forbidden" ]; then
            echo 'Forbidden credential/key-like files are tracked:'
            echo "$forbidden"
            exit 1
          fi
