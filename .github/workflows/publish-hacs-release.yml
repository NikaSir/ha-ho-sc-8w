name: Publish HACS release

on:
  push:
    branches: [main]
    paths:
      - custom_components/nikas_ho_sc_8w/manifest.json
      - .github/workflows/publish-hacs-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-hacs-release
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read and validate integration version
        id: version
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path('custom_components/nikas_ho_sc_8w/manifest.json').read_text(encoding='utf-8'))
          value = manifest.get('version')
          if not isinstance(value, str) or re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', value) is None:
              raise SystemExit(f'Unexpected manifest version: {value!r}')
          print(value)
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing candidate: $version"

      - name: Create missing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to publish."
            exit 0
          fi

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes

          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease
