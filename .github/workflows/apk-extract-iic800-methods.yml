name: Extract exact IIC-800 APK protocol methods

on:
  push:
    branches:
      - analysis/apk-irrigation-commands
    paths:
      - scripts/extract_iic800_apk_methods.py
      - docs/research/inkbird-apk-2.1.11/command-class-evidence.md
      - .github/workflows/apk-extract-iic800-methods.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-iic800-apk-protocol-methods
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: analysis/apk-irrigation-commands
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exact method report
        shell: bash
        run: |
          set -euo pipefail
          python scripts/extract_iic800_apk_methods.py \
            --source docs/research/inkbird-apk-2.1.11/command-class-evidence.md \
            --output docs/research/inkbird-apk-2.1.11/APK_PROTOCOL_METHODS_RU.md

      - name: Commit generated protocol report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/inkbird-apk-2.1.11/APK_PROTOCOL_METHODS_RU.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Record exact IIC-800 APK protocol methods"
          git push origin HEAD:analysis/apk-irrigation-commands
