name: Publish authorized irrigation beta004
on:
  push:
    branches: [publish/irrigation-beta004]
    paths: [.github/workflows/publish-beta004.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: irrigation-beta004-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'NikaSir/ha-ho-sc-8w' && github.actor == 'NikaSir' && github.ref == 'refs/heads/publish/irrigation-beta004'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify exact tested commit and publish prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, subprocess, time
          REPO = 'NikaSir/ha-ho-sc-8w'
          TARGET = '8a4906d1a3872bd3c8e49adca907485d888f0f49'
          TAG = '1.1.2-beta004'
          UI = '1.1.5-beta004'
          prefix = f'repos/{REPO}/'
          def api(route, missing=False, payload=None):
              args = ['gh','api',prefix+route]
              if payload is not None:
                  args += ['--method','POST','--input','-']
              result = subprocess.run(args,input=json.dumps(payload) if payload is not None else None,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if result.returncode:
                  if missing and '404' in result.stderr:
                      return None
                  raise RuntimeError(result.stderr)
              return json.loads(result.stdout)
          def text(path):
              item = api(f'contents/{path}?ref={TARGET}')
              return base64.b64decode(item['content']).decode('utf-8')
          def tag_target():
              ref = api(f'git/ref/tags/{TAG}', missing=True)
              if ref is None:
                  return None
              obj = ref['object']
              for _ in range(3):
                  if obj['type'] == 'commit':
                      return obj['sha']
                  assert obj['type'] == 'tag', obj
                  obj = api('git/tags/'+obj['sha'])['object']
              raise RuntimeError('Unexpected annotated-tag chain')
          assert api('git/ref/heads/main')['object']['sha'] == TARGET, 'main changed; do not publish a moving target'
          required = {'Repository checks','HERO surface regression','Refresh and HERO runtime'}
          for attempt in range(30):
              runs = api(f'actions/runs?head_sha={TARGET}&event=push&per_page=50')['workflow_runs']
              latest = {}
              for run in sorted(runs,key=lambda r:r['id'],reverse=True):
                  if run['head_sha'] == TARGET and run['head_branch'] == 'main':
                      latest.setdefault(run['name'],run)
              for name in required:
                  r = latest.get(name)
                  if r and r['status'] == 'completed' and r['conclusion'] != 'success':
                      raise RuntimeError(f'Required check failed: {name}: {r["conclusion"]}')
              if all(name in latest and latest[name]['status']=='completed' and latest[name]['conclusion']=='success' for name in required):
                  break
              print('Waiting for exact-main checks:', {name:latest.get(name,{}).get('status','missing') for name in required}, flush=True)
              time.sleep(10)
          else:
              raise RuntimeError('Timed out waiting for exact-main CI; no release created')
          assert json.loads(text('custom_components/nikas_ho_sc_8w/manifest.json'))['version'] == TAG
          assert json.loads(text('.nikas-ui-standard.json'))['ui_version'] == UI
          assert f'PANEL_VERSION = "{UI}"' in text('custom_components/nikas_ho_sc_8w/const.py')
          assert f'const NIKAS_HO_SC_8W_UI_VERSION = "{UI}";' in text('custom_components/nikas_ho_sc_8w/frontend/irrigation-panel.js')
          assert tag_target() in (None,TARGET), 'Existing tag targets another commit; never move it'
          stable_before = api('releases/latest', missing=True)
          stable_before_id = stable_before['id'] if stable_before else None
          release = api(f'releases/tags/{TAG}', missing=True)
          if release is None:
              assert api('git/ref/heads/main')['object']['sha'] == TARGET
              release = api('releases', payload={
                  'tag_name': TAG, 'target_commitish': TARGET,
                  'name': f'{TAG} / UI {UI}', 'draft': False, 'prerelease': True, 'make_latest': 'false',
                  'body': '## Автополив — beta004\n\nВ заголовке отображается полная версия: **UI v1.1.5-beta004**. Версии интерфейса, метаданных и URL загрузки синхронизированы.\n\nВключены исправления PR #191: сохранение равномерной голубой подложки HERO после обновления данных и переключения вкладок; зелёная галочка, светло-зелёный фон и рамка после успешного запроса обновления; отдельная красная индикация ошибки.\n\nФото, декоративный круг, компоновка и логика управления поливом не изменены. Зелёная галочка означает завершение запроса обновления HA, а не подтверждение нового измерения контроллера.\n\nПроверены production-контракты, beta-суффикс, кеш-версия и браузерное отображение полного заголовка на 6 размерах экрана в обеих темах. Все обязательные проверки CI в main пройдены. Визуальная приёмка на реальном iPhone — после установки.\n\nПредварительный релиз; стабильная публикация и предыдущие теги не изменены.'
              })
          assert release['draft'] is False and release['prerelease'] is True and release['tag_name'] == TAG
          assert tag_target() == TARGET, 'Published tag must point at the tested release commit'
          stable_after = api('releases/latest', missing=True)
          assert (stable_after['id'] if stable_after else None) == stable_before_id, 'Stable latest changed during publication'
          print(json.dumps({'url':release['html_url'],'tag':TAG,'ui':UI,'commit':TARGET,'prerelease':release['prerelease'],'draft':release['draft']},ensure_ascii=False))
          PY
