name: Install Zone 7 duration-17 probe

on:
  push:
    branches:
      - analysis/apk-irrigation-commands
    paths:
      - scripts/install_zone7_duration17_probe.py
      - .github/workflows/install-zone7-duration17-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/apk-irrigation-commands
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixed probe
        run: python scripts/install_zone7_duration17_probe.py

      - name: Compile integration
        run: python -m compileall -q custom_components/nikas_ho_sc_8w

      - name: Verify fixed-probe safety markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'def prepare_zone7_duration17' custom_components/nikas_ho_sc_8w/api.py
          grep -q 'def execute_zone7_duration17' custom_components/nikas_ho_sc_8w/api.py
          grep -q 'WRITE_ZONE7_DURATION_17_ONCE' custom_components/nikas_ho_sc_8w/const.py
          grep -q 'prepare_zone7_duration17:' custom_components/nikas_ho_sc_8w/services.yaml
          grep -q 'execute_zone7_duration17:' custom_components/nikas_ho_sc_8w/services.yaml
          grep -q 'field.*duration_minutes' custom_components/nikas_ho_sc_8w/api.py || true

      - name: Commit generated integration changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/nikas_ho_sc_8w
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Integrate fixed Zone 7 duration-17 probe"
          git pull --rebase origin analysis/apk-irrigation-commands
          git push origin HEAD:analysis/apk-irrigation-commands
