name: Apply HO-SC-8W composition

on:
  push:
    branches: ["sol/ho-sc-8w-zone-thumbnails"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/ho-sc-8w-zone-thumbnails
          fetch-depth: 0
      - name: Patch panel
        run: python scripts/apply_zone_composition.py
      - name: Validate panel
        run: |
          node --check custom_components/nikas_ho_sc_8w/frontend/irrigation-panel.js
          node scripts/check-panel-ui-v16.mjs
          python -m compileall -q custom_components/nikas_ho_sc_8w
      - name: Commit result
        run: |
          git config user.name "NikaS UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-zone-composition.yml scripts/apply_zone_composition.py
          git add custom_components/nikas_ho_sc_8w/frontend/irrigation-panel.js custom_components/nikas_ho_sc_8w/const.py custom_components/nikas_ho_sc_8w/manifest.json panel.json panel_manifest.json
          git commit -m "Recompose HO-SC-8W zone thumbnails and rain wiring"
          git push origin HEAD:sol/ho-sc-8w-zone-thumbnails
