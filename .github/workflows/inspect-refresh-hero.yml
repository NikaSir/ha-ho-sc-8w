name: Verify refresh and HERO fix
on:
  push:
    branches: [fix/refresh-hero-runtime]
    paths: [.github/workflows/inspect-refresh-hero.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'NikaSir/ha-ho-sc-8w' && github.ref == 'refs/heads/fix/refresh-hero-runtime' && github.actor == 'NikaSir'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Apply inspected source and regression assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('custom_components/nikas_ho_sc_8w/frontend/irrigation-panel.js')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == '2c8ba3df1c2dcac704c2a0dece768043ea7a5fb4', 'Source moved; re-inspect before changing'
          s = p.read_text()
          old = '    card.style.setProperty("background", "var(--card)", "important");\n    card.style.setProperty("border-color", "var(--line)", "important");'
          new = '    // Normal readiness uses the canonical CSS surface, not a white inline override.\n    card.style.removeProperty("background");\n    card.style.setProperty("border-color", "var(--line)", "important");'
          assert s.count(old) == 1
          s = s.replace(old,new)
          old = '.refreshButton.refresh-success{color:#43a047}.refreshButton.refresh-error{color:#e53935}'
          new = '.refreshButton.refresh-success{color:#43a047;background:color-mix(in srgb,#43a047 12%,var(--card));border-color:color-mix(in srgb,#43a047 38%,var(--line))}.refreshButton.refresh-error{color:#e53935;background:color-mix(in srgb,#e53935 12%,var(--card));border-color:color-mix(in srgb,#e53935 38%,var(--line))}'
          assert s.count(old) == 1
          s = s.replace(old,new)
          old = '.refreshButton{color:var(--text)!important}'
          new = '.refreshButton:not(.refresh-success):not(.refresh-error){color:var(--text)!important}'
          assert s.count(old) == 1
          s = s.replace(old,new)
          p.write_text(s)
          p = Path('tests/test_unified_header_v23.py')
          s = p.read_text().replace(old,new)
          s = s.replace('    assert "'+new+'" in PANEL','    assert "'+new+'" in PANEL\n    assert "'+old+'" not in PANEL')
          p.write_text(s)
          PY
      - name: Verify actual production render and action chain
        run: |
          node scripts/check-refresh-hero-runtime.mjs
          node scripts/check-refresh-feedback-ui.mjs
          node scripts/check-desktop-host-boundary.mjs
          node --check custom_components/nikas_ho_sc_8w/frontend/irrigation-panel.js
          python3 tests/test_hero_surface.py
          python3 scripts/check_nikas_ui_standard.py
          git diff --check
      - name: Commit verified source and test only
        run: |
          python3 - <<'PY'
          import subprocess
          paths = ['custom_components/nikas_ho_sc_8w/frontend/irrigation-panel.js','tests/test_unified_header_v23.py']
          changed = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed == set(paths), changed
          subprocess.run(['git','diff','--stat'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','commit','-m','fix(ui): preserve blue HERO surface and green refresh confirmation'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/fix/refresh-hero-runtime'],check=True)
          PY
