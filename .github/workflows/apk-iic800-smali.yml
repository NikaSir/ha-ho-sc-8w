name: Extract exact IIC-800 DEX bytecode

on:
  push:
    branches:
      - analysis/apk-irrigation-commands
    paths:
      - .github/workflows/apk-iic800-smali.yml
      - scripts/extract_iic800_smali_evidence.py
      - scripts/iic800_command_classes.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inkbird-apk-iic800-smali
  cancel-in-progress: true

jobs:
  extract-smali:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/apk-irrigation-commands
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install acquisition prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir requests

      - name: Download and identify the base APK
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import re
          import urllib.parse
          import zipfile
          from pathlib import Path
          import requests

          public_url = "https://disk.yandex.ru/d/3T2zvV8ETXEwjA"
          root = Path("/tmp/iic800-smali-work")
          root.mkdir(parents=True, exist_ok=True)
          bundle = root / "bundle.bin"
          api = "https://cloud-api.yandex.net/v1/disk/public/resources/download?" + urllib.parse.urlencode({"public_key": public_url})
          meta = requests.get(api, timeout=60)
          meta.raise_for_status()
          with requests.get(meta.json()["href"], stream=True, timeout=(60, 900)) as response:
              response.raise_for_status()
              with bundle.open("wb") as handle:
                  for chunk in response.iter_content(1024 * 1024):
                      if chunk:
                          handle.write(chunk)

          def extract(source: Path, dest: Path) -> None:
              dest.mkdir(parents=True, exist_ok=True)
              resolved = dest.resolve()
              with zipfile.ZipFile(source) as zf:
                  for info in zf.infolist():
                      target = (dest / info.filename).resolve()
                      if target != resolved and resolved not in target.parents:
                          raise RuntimeError(f"unsafe path: {info.filename}")
                  zf.extractall(dest)

          queue = [(bundle, 0)]
          seen = set()
          layer = 0
          while queue:
              source, depth = queue.pop(0)
              if depth > 5 or source.suffix.lower() == ".apk" or not zipfile.is_zipfile(source):
                  continue
              signature = hashlib.sha256(source.read_bytes()).hexdigest()
              if signature in seen:
                  continue
              seen.add(signature)
              dest = root / f"layer-{layer:02d}-{source.stem[:40]}"
              layer += 1
              extract(source, dest)
              for child in dest.rglob("*"):
                  if child.is_file() and child.suffix.lower() in {".zip", ".xapk", ".apkm", ".apks"} and zipfile.is_zipfile(child):
                      queue.append((child, depth + 1))

          candidates = []
          for apk in root.rglob("*.apk"):
              with zipfile.ZipFile(apk) as zf:
                  dex = [name for name in zf.namelist() if re.fullmatch(r"(?:.*/)?classes(?:\d+)?\.dex", name, re.I)]
              if not dex:
                  continue
              name = apk.name.lower()
              score = (
                  int(name == "base.apk"),
                  int(not name.startswith("config.") and "split_config" not in name and not name.startswith("split_")),
                  len(dex),
                  apk.stat().st_size,
              )
              candidates.append((score, apk, len(dex)))
          if not candidates:
              raise RuntimeError("base APK not found")
          score, base, dex_count = max(candidates, key=lambda item: item[0])
          Path("/tmp/iic800-smali-base-path").write_text(str(base.resolve()), encoding="utf-8")
          print(f"base={base}; bytes={base.stat().st_size}; dex={dex_count}; score={score}")
          PY

      - name: Locate Android apkanalyzer
        shell: bash
        run: |
          set -euo pipefail
          APKANALYZER="$(command -v apkanalyzer || true)"
          CANDIDATES=(
            "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/apkanalyzer"
            "${ANDROID_HOME:-}/cmdline-tools/latest/bin/apkanalyzer"
            "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/apkanalyzer"
            "/opt/android-sdk/cmdline-tools/latest/bin/apkanalyzer"
          )
          if [[ -z "${APKANALYZER}" ]]; then
            for candidate in "${CANDIDATES[@]}"; do
              if [[ -x "${candidate}" ]]; then
                APKANALYZER="${candidate}"
                break
              fi
            done
          fi
          if [[ -z "${APKANALYZER}" ]]; then
            for root in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" "/usr/local/lib/android/sdk" "/opt/android-sdk"; do
              [[ -d "${root}/cmdline-tools" ]] || continue
              candidate="$(find "${root}/cmdline-tools" -maxdepth 4 -type f -name apkanalyzer -perm -u+x 2>/dev/null | sort -V | tail -n 1 || true)"
              if [[ -n "${candidate}" ]]; then
                APKANALYZER="${candidate}"
                break
              fi
            done
          fi
          if [[ -z "${APKANALYZER}" ]]; then
            echo "apkanalyzer was not found in the hosted Android SDK" >&2
            exit 1
          fi
          echo "${APKANALYZER}" > /tmp/apkanalyzer-path
          "${APKANALYZER}" --help > /tmp/apkanalyzer-help.txt 2>&1 || true
          head -n 40 /tmp/apkanalyzer-help.txt

      - name: Dump selected IIC-800 classes as smali
        shell: bash
        run: |
          set -euo pipefail
          BASE_APK="$(cat /tmp/iic800-smali-base-path)"
          APKANALYZER="$(cat /tmp/apkanalyzer-path)"
          OUT=/tmp/iic800-smali
          mkdir -p "${OUT}"
          failures=0
          while IFS= read -r class_name; do
            [[ -z "${class_name}" || "${class_name}" == \#* ]] && continue
            simple="${class_name##*.}"
            echo "=== ${class_name} ==="
            set +e
            "${APKANALYZER}" dex code --class "${class_name}" "${BASE_APK}" \
              > "${OUT}/${simple}.smali" \
              2> "${OUT}/${simple}.log"
            status=$?
            set -e
            if [[ ${status} -ne 0 ]] || [[ ! -s "${OUT}/${simple}.smali" ]]; then
              failures=$((failures + 1))
              echo "FAILED ${class_name} status=${status}"
              cat "${OUT}/${simple}.log" || true
              rm -f "${OUT}/${simple}.smali"
            else
              echo "$(wc -l < "${OUT}/${simple}.smali") lines"
            fi
          done < scripts/iic800_command_classes.txt
          echo "smali failures=${failures}"
          test "$(find "${OUT}" -type f -name '*.smali' | wc -l)" -gt 0
          tar -C /tmp -czf /tmp/iic800-smali.tar.gz iic800-smali

      - name: Build focused DEX evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/research/inkbird-apk-2.1.11
          python scripts/extract_iic800_smali_evidence.py \
            --smali-root /tmp/iic800-smali \
            --output-dir docs/research/inkbird-apk-2.1.11

      - name: Upload exact bytecode artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkbird-2.1.11-iic800-smali
          path: |
            docs/research/inkbird-apk-2.1.11/smali-evidence.*
            /tmp/iic800-smali.tar.gz
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

      - name: Commit focused bytecode evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/inkbird-apk-2.1.11/smali-evidence.*
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record exact IIC-800 DEX command evidence"
          git pull --rebase origin analysis/apk-irrigation-commands
          git push origin HEAD:analysis/apk-irrigation-commands
