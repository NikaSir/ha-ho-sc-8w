name: Apply HO-SC-8W UI 0.6.14 rebuild

on:
  push:
    branches:
      - feat/ui-v16-zone-scenes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ui-v16-zone-scenes
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Correct staged patch metadata path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-ui-v0614.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('p["standards"]["header"]', 'data["standards"]["header"]')
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply deterministic rebuild
        run: python scripts/apply-ui-v0614.py

      - name: Validate rebuilt bundle
        run: |
          node --check custom_components/nikas_ho_sc_8w/frontend/irrigation-panel.js
          node scripts/check-panel-ui-v16.mjs
          python -m compileall -q custom_components
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if '.git' not in path.parts:
                  json.loads(path.read_text(encoding='utf-8'))
          PY

      - name: Remove one-shot rebuild machinery
        run: |
          git rm scripts/apply-ui-v0614.py
          git rm .github/workflows/apply-ui-v0614.yml

      - name: Commit rebuilt panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Rebuild HO-SC-8W UI 0.6.14 zone scenes"
          git push origin HEAD:feat/ui-v16-zone-scenes
