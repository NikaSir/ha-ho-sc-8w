name: Apply NikaS Panel Template v1

on:
  push:
    branches:
      - panel-template-v1-header-align

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[template-v1-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: panel-template-v1-header-align

      - name: Align HO-SC-8W shell to NikaS Integration Panel Template v1.0
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          bundle = root / 'custom_components/nikas_ho_sc_8w/frontend/irrigation-panel.js'
          text = bundle.read_text(encoding='utf-8')

          replacements = [
              ('const UI_VERSION = "0.4.3";', 'const UI_VERSION = "0.4.4";'),
              ('<button class="backButton" data-back aria-label="Назад"><ha-icon icon="mdi:arrow-left"></ha-icon><span>Назад</span></button>', '<button class="backButton" data-back aria-label="Назад"><ha-icon icon="mdi:arrow-left"></ha-icon></button>'),
              ('grid-template-columns:82px minmax(0,1fr) 82px', 'grid-template-columns:52px minmax(0,1fr) 52px'),
              ('.headerRight{width:82px;min-height:44px}', '.headerRight{width:52px;min-height:44px}'),
              ('display:flex;align-items:center;gap:3px;min-height:44px;padding:0 5px;border:0;background:transparent;color:var(--a);font-size:13px;font-weight:700;cursor:pointer', 'display:grid;place-items:center;width:52px;min-height:44px;padding:0;border:0;background:transparent;color:var(--a);cursor:pointer'),
              ('@media(max-width:420px){.app{padding-right:10px;padding-left:10px}.appHeader{grid-template-columns:74px minmax(0,1fr) 74px}.headerRight{width:74px}', '@media(max-width:420px){.app{padding-right:10px;padding-left:10px}.appHeader{grid-template-columns:48px minmax(0,1fr) 48px}.backButton{width:48px}.headerRight{width:48px}'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected frontend fragment not found: {old[:90]}')
              text = text.replace(old, new, 1)

          bundle.write_text(text, encoding='utf-8')

          const_path = root / 'custom_components/nikas_ho_sc_8w/const.py'
          const = const_path.read_text(encoding='utf-8')
          if 'PANEL_VERSION = "0.4.3"' not in const:
              raise SystemExit('Expected PANEL_VERSION 0.4.3 not found')
          const_path.write_text(const.replace('PANEL_VERSION = "0.4.3"', 'PANEL_VERSION = "0.4.4"', 1), encoding='utf-8')

          manifest_path = root / 'custom_components/nikas_ho_sc_8w/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('version') != '1.0.0-b005.6':
              raise SystemExit(f"Unexpected integration version: {manifest.get('version')}")
          manifest['version'] = '1.0.0-b005.7'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          panel_path = root / 'panel.json'
          panel = json.loads(panel_path.read_text(encoding='utf-8'))
          panel['panel']['dashboard_version'] = '0.4.4'
          panel.setdefault('standards', {})['integration_panel_template'] = 'NikaS Integration Panel Template v1.0'
          panel['standards']['header'] = 'icon_only_back_symmetric_52px'
          panel_path.write_text(json.dumps(panel, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('Current panel version: **0.4.3**.', 'Current panel version: **0.4.4**.', 1)
          marker = 'The panel follows **Home Assistant NikaS · Integration Dashboard UI Standard v1.2**:'
          if marker in readme and 'NikaS Integration Panel Template v1.0' not in readme:
              readme = readme.replace(marker, marker + '\n\nIt also conforms to **NikaS Integration Panel Template v1.0**.', 1)
          readme = readme.replace('- compact Header with explicit `← Назад`;', '- compact symmetric Header with icon-only `←` Back;')
          readme_path.write_text(readme, encoding='utf-8')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = '- `1.0.0-b005.7` / panel `0.4.4`: align the irrigation shell with NikaS Integration Panel Template v1.0 — icon-only Back, symmetric 52/52 px Header slots (48/48 narrow), centered title and unchanged fixed Bottom Tab Bar.\n- `1.0.0-b005.7` / panel `0.4.4`: UI-only standardization; controller logic, DP handling and write safety are unchanged.\n'
          changed = '### Changed\n\n'
          if entry.splitlines()[0] not in changelog:
              if changed not in changelog:
                  raise SystemExit('CHANGELOG Changed section not found')
              changelog = changelog.replace(changed, changed + entry, 1)
          changelog_path.write_text(changelog, encoding='utf-8')

          Path('.github/workflows/apply-panel-template-v1.yml').unlink()
          PY

      - name: Validate bundle
        run: node --check custom_components/nikas_ho_sc_8w/frontend/irrigation-panel.js

      - name: Commit aligned release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ui: align with NikaS Panel Template v1.0 [template-v1-done]"
          git push origin HEAD:panel-template-v1-header-align
